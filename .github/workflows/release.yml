name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: pingchecker

jobs:
  build:
    name: ${{ matrix.platform.name }}${{ matrix.renderer.suffix }}
    runs-on: ${{ matrix.platform.os }}
    env:
      PACKAGE_VARIANT: ${{ matrix.platform.name }}${{ matrix.renderer.suffix }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-amd64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-amd64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
        renderer:
          - { feature: glow, suffix: '' }
          - { feature: wgpu, suffix: '-wgpu' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.platform.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.PACKAGE_VARIANT }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.platform.target }} --no-default-features --features ${{ matrix.renderer.feature }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir="$BIN-$GITHUB_REF_NAME-$PACKAGE_VARIANT"
          mkdir "$dir"
          cp "target/${{ matrix.platform.target }}/release/$BIN" "$dir"/
          for f in LICENSE* README.md; do if [ -f "$f" ]; then cp "$f" "$dir"/; fi; done
          tar -czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:BIN-$env:GITHUB_REF_NAME-$env:PACKAGE_VARIANT"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/${{ matrix.platform.target }}/release/$env:BIN.exe" $dir
          Get-ChildItem LICENSE*, README.md -ErrorAction SilentlyContinue | Copy-Item -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          "ASSET=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_VARIANT }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
