[package]
name = "pingchecker"
version = "0.2.1"
edition = "2024"
description = "Native ICMP, TCP and HTTP availability monitor"
license = "MIT"

[features]
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu"]

[dependencies]
anyhow = "1"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "x11", "wayland", "accesskit"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "time", "sync", "macros", "io-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "wgsl", "dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "wgsl", "vulkan"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = "thin"
strip = true
